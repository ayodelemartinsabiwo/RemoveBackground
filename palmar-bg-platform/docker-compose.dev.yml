version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: palmar-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palmar_bg
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - palmar-network-dev

  # Redis (Queue + Cache)
  redis:
    image: redis:7-alpine
    container_name: palmar-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - palmar-network-dev

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: palmar-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - palmar-network-dev

  # MinIO Client - Create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: palmar-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/palmar-bg-images --ignore-existing;
      mc policy set download myminio/palmar-bg-images;
      exit 0;
      "
    networks:
      - palmar-network-dev

  # Node.js API Service (Development with hot reload)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: palmar-api-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-key
      JWT_REFRESH_SECRET: dev-refresh-secret-key
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/database:/app/node_modules/@palmar/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - palmar-network-dev
    command: npm run dev

  # Python Worker (Development)
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile.dev
    container_name: palmar-worker-dev
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
      MODEL_NAME: birefnet-portrait
      SMALL_RESOLUTION: 512
      HD_RESOLUTION: 1920
      ULTRA_HD_RESOLUTION: 3840
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./apps/worker/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - palmar-network-dev

  # Celery Worker (Development)
  celery:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile.dev
    container_name: palmar-celery-dev
    command: celery -A app.celery_app worker --loglevel=debug --concurrency=1
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
      MODEL_NAME: birefnet-portrait
      SMALL_RESOLUTION: 512
      HD_RESOLUTION: 1920
      ULTRA_HD_RESOLUTION: 3840
    volumes:
      - ./apps/worker/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - palmar-network-dev

  # React Web Frontend (Development with hot reload)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: palmar-web-dev
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "3000:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      - api
    networks:
      - palmar-network-dev
    command: npm run dev -- --host

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  minio_dev_data:
    driver: local

networks:
  palmar-network-dev:
    driver: bridge

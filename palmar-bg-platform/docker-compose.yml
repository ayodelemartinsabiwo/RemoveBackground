version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: palmar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palmar_bg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - palmar-network

  # Redis (Queue + Cache)
  redis:
    image: redis:7-alpine
    container_name: palmar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - palmar-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: palmar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - palmar-network

  # Node.js API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: palmar-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - palmar-network
    restart: unless-stopped

  # Python AI Worker Service
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: palmar-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
      MODEL_NAME: birefnet-portrait
      SMALL_RESOLUTION: 512
      HD_RESOLUTION: 1920
      ULTRA_HD_RESOLUTION: 3840
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - palmar-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Celery Worker (Python async tasks)
  celery:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: palmar-celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/palmar_bg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: palmar-bg-images
      S3_REGION: us-east-1
      MODEL_NAME: birefnet-portrait
      SMALL_RESOLUTION: 512
      HD_RESOLUTION: 1920
      ULTRA_HD_RESOLUTION: 3840
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - palmar-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

  # React Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: palmar-web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - palmar-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  palmar-network:
    driver: bridge
